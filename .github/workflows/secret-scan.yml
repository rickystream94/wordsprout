name: Secret Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  gitignore-check:
    name: Verify sensitive files are git-ignored
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check sensitive files are not tracked
        shell: bash
        run: |
          FOUND=$(git ls-files \
            | grep -E '(^|/)(local\.settings\.json|\.env($|\.)|[^/]+\.(pfx|p12|pem))$' \
            | grep -Ev '\.(example|sample)$' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Sensitive files tracked in git:"
            echo "$FOUND"
            exit 1
          fi
          echo "All sensitive file patterns are excluded from git."
